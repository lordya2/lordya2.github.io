description_ko: AI의 예측과 분석을 현장의 결정과 실행으로 연결하는 운영관리의 관점. 수요예측·재고·배송부터 고객센터·병원·플랫폼까지, 다양한 산업의 사례를 통해 AI가 성과로 이어지는 조건을 살펴봅니다.
description_en: A Korean-language book on connecting AI predictions and analysis to operating decisions, implementation, and measurable outcomes, with examples from inventory, delivery, retail, healthcare, and platforms.
